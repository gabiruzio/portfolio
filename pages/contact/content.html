

<h2 data-l="c-title-1">Fale Comigo</h2>
<div id="contact-1">
<aside>
    <img src="assets/icons/mail.svg" alt="">
</aside>
<section>
    <form action="" method="get">
        <br>
        <span data-l="c-i-email" class="input-title">Email</span>
        <input type="text" name="ola" id="input-email"> 
        <span data-l="c-i-email-warning" class="input-warning invisible" id="warning-email">Email inválido</span>
        <br>

        <span data-l="c-i-sub" class="input-title">Assunto</span>
        <input type="text" name="" id="input-subject">
        <span data-l="c-i-sub-warning" class="input-warning invisible" id="warning-subject">Muito curto, no mínimo 4 letras</span>
        <br>

        <span data-l="c-i-tex" class="input-title">Texto</span>
        <textarea type="text" name="" id="input-text" rows="5"></textarea>
        <span data-l="c-i-tex-warning" class="input-warning invisible" id="warning-text">Muito curto, no mínimo 20 letras</span>
        <br>
        
        <button data-l="c-i-btn" id="submit-email" type="button" onclick="submit_on_click()">Enviar</button>
        <span data-l="c-i-btn-warning" class="input-successfully invisible" id="warning-sent">Enviado com sucesso</span>
    </form> 
</section>
<br>
